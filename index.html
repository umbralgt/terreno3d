<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi terreno en 3D · Lab 2 · UMBRAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#0a0a0a;--white:#ffffff;--ground:#f4f4f2;
  --g100:#f7f7f7;--g200:#efefef;--g300:#e3e3e3;--g400:#cfcfcf;--g500:#9a9a9a;--g600:#6b6b6b;--g700:#4a4a4a;
  --azul:#2f5bd3;--line:1.5px solid var(--black);--soft:1px solid var(--g300);
  --font:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --nav-h:54px;--panel:360px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:light; } }
:root[data-theme="dark"]{ color-scheme:light; }
html{height:100%;font-size:14px}
body{height:100%;overflow:hidden;background:var(--white);color:var(--black);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.45}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
#app{display:grid;grid-template-rows:var(--nav-h) 1fr;grid-template-columns:1fr var(--panel);height:100%}

/* Barra superior (igual a las otras herramientas de UMBRAL) */
#nav{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:var(--line);background:var(--white);z-index:20}
#nav-logo{display:flex;align-items:center;height:100%;padding-right:16px;border-right:var(--soft);font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--black);text-decoration:none;white-space:nowrap}
#nav-links{display:flex;gap:4px;flex:1;overflow-x:auto}
.nav-mod{display:flex;align-items:center;height:34px;padding:0 12px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g600);text-decoration:none;white-space:nowrap}
.nav-mod:hover,.nav-mod.active{color:var(--black);background:var(--g200)}
.nav-back{margin-left:auto;padding:8px 16px;border-radius:8px;background:var(--black);color:var(--white);font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap}

/* Vista 3D */
#vista{position:relative;grid-column:1;grid-row:2;background:var(--ground);overflow:hidden;touch-action:none;border-right:var(--soft)}
#c{display:block;width:100%;height:100%;cursor:grab}
#c:active{cursor:grabbing}
#guias{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2}
.tag{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;background:var(--white);color:var(--black);border:1.5px solid var(--black);border-radius:4px;padding:3px 7px;pointer-events:none;z-index:3}
.tag.neg{background:var(--black);color:var(--white)}
.tag.acc{border-color:var(--azul);color:var(--azul)}
.grupo{position:absolute;display:flex;gap:6px;z-index:5}
#mostrar{top:14px;left:14px;flex-direction:column;align-items:flex-start}
#vistas{top:14px;right:14px}
.mini-t{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600)}
.chip{min-height:34px;padding:0 12px;border:1.5px solid var(--g400);border-radius:8px;background:var(--white);font-size:11px;font-weight:600;color:var(--g600)}
.chip.on{border-color:var(--black);color:var(--black)}
.chip.sel{background:var(--black);border-color:var(--black);color:var(--white)}
.chip.icon{width:34px;padding:0;font-size:14px;font-weight:700;color:var(--black);border-color:var(--black)}
#stepper{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px;border:var(--line);border-radius:12px;background:var(--white);z-index:6}
.big{width:48px;height:48px;border:var(--line);border-radius:8px;background:var(--white);font-size:22px;font-weight:600;line-height:1}
.big.pri{background:var(--black);color:var(--white)}
.big:disabled{opacity:.3;cursor:not-allowed}
#niv{display:flex;flex-direction:column;align-items:center;min-width:112px}
#niv b{font-size:19px;font-weight:700}
#niv span{font-size:11px;color:var(--g600)}
#llenar:disabled{opacity:.35;cursor:not-allowed}
#btn-mostrar{display:none}
#llenar{height:48px;padding:0 14px;border:var(--line);border-radius:8px;background:var(--white);font-size:12px;font-weight:600}
#umbral{position:absolute;left:14px;bottom:96px;width:350px;max-width:calc(100% - 28px);padding:13px 16px;border:var(--line);border-radius:10px;background:var(--white);z-index:6;display:none}
#umbral.acc{border-color:var(--azul)}
#umbral p{font-size:13px;line-height:1.5}
#umbral .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:14px;color:var(--g600)}
#sello{position:absolute;right:14px;bottom:18px;padding:5px 8px;border:1px solid var(--g400);border-radius:6px;background:var(--white);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g600);z-index:4}
#aviso{position:absolute;top:60px;left:50%;transform:translateX(-50%);max-width:min(520px,90%);padding:9px 14px;border:1px solid var(--g400);border-radius:8px;background:var(--white);font-size:12px;color:var(--g700);z-index:5;display:none;text-align:center}

/* Panel */
#panel{grid-column:2;grid-row:2;display:flex;flex-direction:column;overflow:hidden;background:var(--white)}
#panel-top{padding:14px 16px;border-bottom:var(--soft);display:flex;flex-direction:column;gap:10px}
#predio{font-size:12px;color:var(--g700)}
#scroll{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin}
.seg{display:flex;border:var(--line);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{flex:1;min-height:38px;padding:0 6px;border:0;background:transparent;font-size:12px;font-weight:600}
.seg button+button{border-left:var(--line)}
.seg button.sel{background:var(--black);color:var(--white);font-weight:700}
.seg button:disabled{color:var(--g400);cursor:not-allowed}
.bloque{display:flex;flex-direction:column;gap:6px}
.barra{display:flex;height:14px;border:var(--line);border-radius:4px;overflow:hidden;position:relative;background:var(--white)}
.barra i{display:block;height:100%}
.barra .marca{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px dashed var(--black)}
.fila-b{display:flex;justify-content:space-between;font-size:10px;color:var(--g600)}
.cifras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cif{border:var(--soft);border-radius:8px;padding:9px 10px}
.cif b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.cif span{font-size:11px;color:var(--g600)}
.cif.full{grid-column:span 2;border:var(--line)}
.cif.full b{font-size:20px}
.tec{display:none}
body.tecnico .tec{display:flex}
body.tecnico .tec.grid{display:grid}
.campos{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--g600)}
.campo input,.campo select{height:36px;padding:0 8px;border:var(--line);border-radius:8px;background:var(--white);font-size:12px;width:100%}
table.niveles{width:100%;border-collapse:collapse;font-size:11px}
table.niveles th{text-align:left;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--g600);padding:5px 4px;background:var(--g200)}
table.niveles td{padding:5px 4px;border-top:1px solid var(--g300);font-variant-numeric:tabular-nums}
.tabla-wrap{max-height:190px;overflow:auto;border:var(--soft);border-radius:8px}
#panel-pie{padding:12px 16px;border-top:var(--soft);display:flex;flex-direction:column;gap:8px}
.cta{display:flex;justify-content:space-between;align-items:center;min-height:40px;padding:0 12px;border:var(--line);border-radius:8px;background:var(--white);font-size:12px;font-weight:700;color:var(--black);text-decoration:none;width:100%}
.links{display:flex;justify-content:space-between;font-size:11px}
.links a,.links button{color:var(--g700);background:none;border:0;font-size:11px;text-decoration:underline}
.g{border-bottom:1px dotted var(--g600);cursor:help}

/* Popover de glosario y modal */
#pop{position:fixed;z-index:50;max-width:280px;padding:11px 13px;border:var(--line);border-radius:8px;background:var(--white);font-size:12px;line-height:1.5;display:none;box-shadow:0 6px 24px rgba(0,0,0,.08)}
#pop b{display:block;margin-bottom:3px}
#pop small{display:block;margin-top:5px;color:var(--g600)}
#modal{position:fixed;inset:0;z-index:60;background:rgba(10,10,10,.35);display:none;align-items:center;justify-content:center;padding:16px}
#modal .caja{width:min(640px,100%);max-height:88%;overflow:auto;background:var(--white);border:var(--line);border-radius:12px;padding:22px 24px}
#modal h2{font-size:19px;letter-spacing:-.02em;margin-bottom:10px}
#modal p,#modal li{font-size:13px;line-height:1.6;color:var(--g700)}
#modal ul{padding-left:18px;margin:8px 0 12px;display:flex;flex-direction:column;gap:4px}
#modal table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 12px}
#modal th,#modal td{text-align:left;padding:7px 8px;border-top:1px solid var(--g300);vertical-align:top}
#modal th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--g600);background:var(--g200)}
#modal .cerrar{float:right;border:0;background:none;font-size:18px;color:var(--g600)}

/* Recorrido guiado */
#tour{position:absolute;left:50%;bottom:100px;transform:translateX(-50%);width:min(420px,calc(100% - 28px));padding:18px;border:var(--line);border-radius:14px;background:var(--white);z-index:30;display:none;flex-direction:column;gap:10px}
#tour .pasos{display:flex;gap:4px}
#tour .pasos i{width:18px;height:4px;border-radius:2px;background:var(--g400)}
#tour .pasos i.on{background:var(--black)}
#tour h3{font-size:19px;letter-spacing:-.02em}
#tour p{font-size:14px;line-height:1.55;color:var(--g700)}
#tour .acc{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
#tour .acc button{min-height:44px;padding:0 16px;border:var(--line);border-radius:8px;background:var(--white);font-size:13px;font-weight:600}
#tour .acc .pri{background:var(--black);color:var(--white)}
#tour .acc button:disabled{opacity:.35;cursor:not-allowed}
#tour .acc .saltar{border:0;text-decoration:underline;color:var(--g600);padding:0 4px}
.foco{position:relative;z-index:31!important;box-shadow:0 0 0 4px var(--azul)!important;border-radius:10px}
#velo{position:absolute;inset:0;background:rgba(244,244,242,.55);z-index:25;display:none}

@media (max-width:768px){
  :root{--panel:100%}
  #app{grid-template-columns:1fr;grid-template-rows:var(--nav-h) 54% 1fr}
  #vista{border-right:0}
  #panel{grid-column:1;grid-row:3;border-top:var(--line);border-radius:14px 14px 0 0;margin-top:-10px;z-index:10}
  #nav-links{display:none}
  #nav{padding:0 12px}
  #mostrar{top:8px;left:8px}
  #mostrar .mini-t{display:none}
  #btn-mostrar{display:inline-flex;align-items:center}
  #mostrar [data-show]{display:none}
  #mostrar.abierto [data-show]{display:inline-flex;align-items:center}
  #aviso{top:52px;font-size:11px;padding:7px 10px}
  #vistas{top:8px;right:8px}
  .chip{min-height:30px;padding:0 9px;font-size:10px}
  #stepper{bottom:18px;gap:6px;padding:5px 7px}
  .big{width:44px;height:44px}
  #niv{min-width:80px}
  #llenar{height:44px;padding:0 10px}
  #umbral{bottom:84px;left:8px;right:8px;width:auto}
  #sello{display:none}
  #tour{bottom:12px}
  .tag{font-size:8.5px;padding:2px 5px}
}
</style>
</head>

<div id="app">
  <nav id="nav">
    <a id="nav-logo" href="https://lab2.umbralgt.com">( U ) &nbsp; Lab 2 · Arquitectura</a>
    <div id="nav-links">
      <a class="nav-mod" href="https://mapa-pot.umbralgt.com">Mapa POT</a>

      <button class="chip on" data-show="sot" aria-pressed="true">Sótanos</button>
      <button class="chip on" data-show="vec" aria-pressed="true">Vecinos</button>
      <button class="chip on" data-show="amb" aria-pressed="true">Ambiente</button>

    <div class="grupo" id="vistas" role="group" aria-label="Vista">

  <aside id="panel">
    <div id="panel-top">
      <div class="seg" role="group" aria-label="Nivel de detalle">

      <div class="bloque" id="b-esc">

          <button data-esc="base" class="sel">Base</button>

          <button data-esc="maximo">Máximo*</button>
        </div>
      </div>
      <div class="bloque">
        <div class="fila-b" style="font-size:12px;color:var(--black)"><span style="font-weight:600">Metros permitidos usados</span><b id="pct">0%</b></div>
        <div class="barra" id="barra"></div>

  </aside>
</div>
<div id="pop" role="tooltip"></div>

<script>/* pot-motor.js · UMBRAL Lab 2 · motor compartido Calculadora POT + Modelo 3D
   Reglas: Ficha normativa POT (COM-030-08 con reformas; COM-48-2024 por verificar). */
(function(root){
// V14: parámetros verificados contra el reglamento POT (arts. 42-47, 47 Bis). Ver Ficha normativa POT.
const POT = {
  G1:{ie:1.2, ie_a:1.8,  ie_max:null, alt:16,  alt_a:24,  alt_max:null, perm:.70,bs:8, sepBS:3,fDCT:20,aDCT:1000,nom:'Rural'},
  G2:{ie:1.8, ie_a:2.7,  ie_max:null, alt:16,  alt_a:24,  alt_max:null, perm:.40,bs:8, sepBS:3,fDCT:8, aDCT:120, nom:'Semiurbana'},
  G3:{ie:2.7, ie_a:4.0,  ie_max:null, alt:16,  alt_a:24,  alt_max:null, perm:.10,bs:12,sepBS:3,fDCT:3, aDCT:60,  nom:'Urbana'},
  G4:{ie:4.0, ie_a:6.0,  ie_max:9.0,  alt:32,  alt_a:48,  alt_max:96,   perm:.00,bs:16,sepBS:4,fDCT:15,aDCT:450, nom:'Central'}, // Confirmado: POT COM-030-08 art. 46 (texto con reformas 2011-2013)
  G5:{ie:6.0, ie_a:9.0,  ie_max:11.0, alt:64,  alt_a:96,  alt_max:128,  perm:.00,bs:16,sepBS:5,fDCT:21,aDCT:600, nom:'Núcleo'} // ie/alt base y ampliado confirmados (art. 47). ie_max 11.0 / alt_max 128 según COM-48-2024 — PENDIENTE verificar texto oficial
};

const LAB1_VENTA = {
  z01:1771,z02:1935,z04:2601,z05:2705,z06:1394,z07:1695,z09:2040,
  z10:2778,z11:2292,z12:2055,z13:2473,z14:2533,z15:2840,z16:2079,z17:1630,z18:1055,
  z21:1191
};

const IVA_TASA = 0.12; // IVA Guatemala (SAT) — primera venta de inmueble nuevo


// Supuestos del desarrollador (prefijo 'p' = Pro, 't' = Tasador)

// Parámetros según escenario
function paramsEscenario(zonaG, esc){
  const g=POT[zonaG];
  const esMax = esc==='max' && (zonaG==='G4'||zonaG==='G5') && !!g.ie_max;
  const esMedio = esc==='max' && !esMax;
  return {g, esMax, esMedio,
    ie:  esMax?g.ie_max : esMedio?g.ie_a : g.ie,
    alt: esMax?g.alt_max: esMedio?g.alt_a: g.alt};
}

// Estacionamientos: mínimo normativo vs. diseño elegido por el usuario.
// Cada componente nunca queda por debajo de la norma.
// Visitas según Anexo I del COM-03-2009: por m² residenciales totales, no por unidad.
// (Límites intermedios 1,500/3,000/4,500 m²: verificar con el texto oficial.)
function visitasNorma(m2R){
  if(m2R<500) return 0;
  if(m2R<=1500) return 3;
  if(m2R<=3000) return 4;
  if(m2R<=4500) return 6;
  return Math.ceil(m2R/800);
}

function estacionamientos(o){
  const esZonaAlta = o.zonaG==='G3'||o.zonaG==='G4'||o.zonaG==='G5';
  // COM-03-2009 (ratios trabajados en versiones anteriores) · VERIFICAR vigencia con COM-29-2025
  const normRes = esZonaAlta ? Math.ceil(o.m2R/300) : Math.ceil(o.m2R/100);
  const normVis = visitasNorma(o.m2R);
  const am = o.am>0 ? Math.ceil(o.am/75) : 0; // COM-29-2025: 1 c/75 m² áreas sociales
  const disRes = Math.ceil(o.nu*o.plazasU);
  const disVis = (o.visitas!=null && o.visitas>=0) ? o.visitas : normVis;
  const res = Math.max(normRes, disRes);
  const vis = Math.max(normVis, disVis);
  return {normRes, normVis, am, norma:normRes+normVis+am,
          disRes, disVis, res, vis, total:res+vis+am};
}

// Sótano por plazas × m²/plaza. Nunca ocupa el área permeable mínima.
function calcSotanoV10(o){
  const permMin = o.area*o.perm;
  const areaNivelMax = o.area*(1-o.perm);
  const areaLibre = o.permiteSup ? Math.max(0, o.area - o.huella - permMin) : 0;
  const sup = Math.floor(areaLibre/o.m2Plaza);
  const avisos=[];
  if(o.ancho>0 && o.largo>0 && Math.min(o.ancho,o.largo)<15) avisos.push('angosto');

  if(o.nivDecl>0){ // sótano declarado por el usuario
    const aDecl = o.areaDecl>0 ? o.areaDecl : areaNivelMax;
    const excedePerm = aDecl > areaNivelMax + 0.5;
    const aN = Math.min(aDecl, areaNivelMax);
    const plazasSot = o.nivDecl*Math.floor(aN/o.m2Plaza);
    const plazasSup = Math.min(sup, Math.max(0,o.plazas-plazasSot));
    return {modo:'declarado', niveles:o.nivDecl, areaNivel:aN, m2Sot:aN*o.nivDecl,
            plazasSot, plazasSup, capacidad:plazasSot+sup,
            suficiente:plazasSot+sup>=o.plazas, excedePerm, avisos};
  }
  if(sup>=o.plazas){
    return {modo:'superficie', niveles:0, m2Sot:0, plazasSot:0, plazasSup:o.plazas,
            capacidad:sup, suficiente:true, excedePerm:false, avisos};
  }
  const plazasSot = o.plazas - sup;
  const porNivel = Math.floor(areaNivelMax/o.m2Plaza);
  if(porNivel<1){
    return {modo:'inviable', niveles:0, m2Sot:0, plazasSot:0, plazasSup:sup,
            capacidad:sup, suficiente:false, excedePerm:false, avisos};
  }
  const niveles = Math.ceil(plazasSot/porNivel);
  if(niveles>4) avisos.push('muchos_niveles');
  return {modo:'auto', niveles, areaNivel:areaNivelMax, porNivel,
          m2Sot:plazasSot*o.m2Plaza, plazasSot, plazasSup:sup,
          capacidad:sup+niveles*porNivel, suficiente:true, excedePerm:false, avisos};
}

// Costos completos sin terreno (incluye costos del desarrollador)
function costosProyecto(o){
  const obraSup = o.m2T*o.cm2;
  const obraSot = o.sot.m2Sot*o.cSot;
  const obra = obraSup+obraSot;
  const cDi = obra*o.di/100, cAd = obra*o.ad/100, cIns = obra*o.ins/100;
  const cImp = obra*o.dev.imp/100;
  const cUrb = o.area*18;
  const licE = Math.round(o.m2T*2.5*({G1:.8,G2:.9,G3:1,G4:1.2,G5:1.4}[o.zonaG]||1));
  const m2Inc = o.esMax ? Math.max(0, o.m2T - o.area*POT[o.zonaG].ie) : 0;
  const cCau = Math.round(m2Inc*o.cm2*0.05);
  const cCom = o.ventas*o.dev.com/100;
  const baseFin = obra+cDi+cAd+cIns+cImp+cUrb+licE+cCau;
  // Saldo promedio ~50% durante el plazo (desembolso progresivo). El terreno se asume con capital propio.
  const cFin = baseFin*(o.dev.finPct/100)*(o.dev.finTasa/100)*(o.dev.finMeses/12)*0.5;
  let ivaDeb=0, ivaCred=0, cIva=0;
  if(o.dev.iva==='si' && o.ventas>0){
    ivaDeb  = o.ventas*IVA_TASA/(1+IVA_TASA);                    // IVA incluido en el precio de venta
    ivaCred = (obra+cDi+cAd+cIns+cImp+cCom)*IVA_TASA/(1+IVA_TASA); // crédito fiscal de costos facturados
    cIva = Math.max(0, ivaDeb-ivaCred);
  }
  const total = baseFin+cCom+cFin+cIva;
  return {obraSup, obraSot, obra, cDi, cAd, cIns, cImp, cUrb, licE, cCau, m2Inc,
          cCom, cFin, ivaDeb, ivaCred, cIva, total};
}

// Programa automático: respeta IE del escenario Y la altura
function programaAuto(zonaG, area, tipoU, esc, altPT, ci){
  const p = paramsEscenario(zonaG, esc);
  const nMax = Math.max(1, Math.floor(p.alt/altPT));
  const huellaMax = area*(1-p.g.perm)*0.90;
  const m2TporIE = area*p.ie;
  const m2TporAlt = huellaMax*nMax;
  const limitaAltura = m2TporAlt < m2TporIE;
  const m2Tmax = Math.min(m2TporIE, m2TporAlt);
  const unidades = Math.floor(m2Tmax/(1+ci)/tipoU); // 0 = no cabe ni una unidad
  const m2R = unidades*tipoU, m2T = m2R*(1+ci);
  const niveles = Math.ceil(m2T/Math.max(huellaMax,1));
  return {p, unidades, m2R, m2T, niveles, nMax, huellaMax, limitaAltura};
}

// Proyecto completo (lo usan Pro y Tasador)
function evaluarProyecto(o){
  // o: zonaG, esc, area, ancho, largo, nu, au, ci, cm2, di, ad, ins, altPT, am,
  //    plazasU, visitas, m2Plaza, cSot, nivDecl, areaDecl, pv, dev
  const P = paramsEscenario(o.zonaG, o.esc);
  const g = P.g;
  const m2R = o.nu*o.au;
  const m2T = m2R*(1+o.ci/100);
  const m2E = o.area*P.ie;
  const nMax = Math.max(1, Math.floor(P.alt/o.altPT));
  const huellaMax = o.area*(1-g.perm);
  const huella = m2T/nMax;
  const est = estacionamientos({zonaG:o.zonaG, nu:o.nu, m2R, am:o.am, plazasU:o.plazasU, visitas:o.visitas});
  const sot = calcSotanoV10({area:o.area, perm:g.perm, huella:Math.min(huella,huellaMax),
    plazas:est.total, m2Plaza:o.m2Plaza, ancho:o.ancho, largo:o.largo,
    nivDecl:o.nivDecl||0, areaDecl:o.areaDecl||0,
    permiteSup: o.zonaG==='G1'||o.zonaG==='G2'||o.zonaG==='G3'});
  const ventas = o.pv ? m2R*o.pv : 0;
  const C = costosProyecto({zonaG:o.zonaG, area:o.area, m2T, cm2:o.cm2, di:o.di, ad:o.ad, ins:o.ins,
    sot, cSot:o.cSot, esMax:P.esMax, dev:o.dev, ventas});
  return {P, g, m2R, m2T, m2E, nMax, huella, huellaMax, est, sot, ventas, C,
          cumIE: m2T <= m2E+0.5,
          cumAlt: huella <= huellaMax+0.5,
          nivNec: Math.ceil(m2T/Math.max(huellaMax,1))};
}

// Valor residual: el desarrollador exige margen sobre INVERSIÓN TOTAL (terreno + costos)
// Ventas = (Terreno + Costos) × (1 + m)  →  Terreno = Ventas/(1+m) − Costos
function valorResidual(ventas, costosSinTerreno, margenPct){
  return Math.max(0, ventas/(1+margenPct/100) - costosSinTerreno);
}
// ==================== GEOMETRÍA (requiere ClipperLib) ====================
// Coordenadas en metros locales. Clipper trabaja con enteros: escala 100 = centímetros.
const ESC_CL = 100;
function _CL(){ return (typeof ClipperLib!=='undefined') ? ClipperLib : require('clipper-lib'); }
function aClipper(paths){ return paths.map(r=>r.map(([x,y])=>({X:Math.round(x*ESC_CL),Y:Math.round(y*ESC_CL)}))); }
function deClipper(paths){ return paths.map(r=>r.map(p=>[p.X/ESC_CL,p.Y/ESC_CL])); }
function areaPaths(paths){ const CL=_CL(); return aClipper(paths).reduce((s,r)=>s+CL.Clipper.Area(r),0)/(ESC_CL*ESC_CL); }
// Área con signo por anillo → usamos el valor absoluto del total de anillos exteriores menos huecos
function areaAbs(paths){ return Math.abs(areaPaths(paths)); }

// Reduce una forma hacia adentro d metros (retiro uniforme desde todos los bordes)
function insetPaths(paths, d){
  if(d<=0) return paths;
  const CL=_CL(); const co=new CL.ClipperOffset(2, 0.25*ESC_CL);
  co.AddPaths(aClipper(paths), CL.JoinType.jtMiter, CL.EndType.etClosedPolygon);
  const sol=new CL.Paths(); co.Execute(sol, -d*ESC_CL);
  return deClipper(sol);
}
function interseccion(a, b){
  const CL=_CL(); const c=new CL.Clipper();
  c.AddPaths(aClipper(a), CL.PolyType.ptSubject, true); c.AddPaths(aClipper(b), CL.PolyType.ptClip, true);
  const sol=new CL.Paths(); c.Execute(CL.ClipType.ctIntersection, sol, CL.PolyFillType.pftNonZero, CL.PolyFillType.pftNonZero);
  return deClipper(sol);
}
// Retira la forma hacia adentro hasta que su área sea <= objetivo (búsqueda binaria del retiro)
function insetHastaArea(paths, objetivo){
  if(areaAbs(paths) <= objetivo) return {paths, d:0};
  let lo=0, hi=200;
  for(let i=0;i<40;i++){ const m=(lo+hi)/2; (areaAbs(insetPaths(paths,m))>objetivo) ? lo=m : hi=m; }
  return {paths: insetPaths(paths,hi), d:hi};
}
// Convierte un anillo lon/lat a metros locales alrededor de su centro
function lonLatAMetros(ring){
  const n=ring.length, cx=ring.reduce((s,p)=>s+p[0],0)/n, cy=ring.reduce((s,p)=>s+p[1],0)/n;
  const kx=111320*Math.cos(cy*Math.PI/180), ky=110574;
  return {ring: ring.map(([x,y])=>[(x-cx)*kx,(y-cy)*ky]), centro:[cx,cy]};
}

// ==================== VOLUMETRÍA PISO POR PISO ====================
// Escenarios: 'base' | 'ampliado' | 'maximo' (maximo solo G4/G5, valores COM-48-2024 por verificar)
function limitesEscenario(zonaG, esc){
  const g=POT[zonaG];
  if(esc==='maximo' && g.ie_max) return {ie:g.ie_max, alt:g.alt_max, porVerificar:true};
  if(esc==='ampliado' || esc==='maximo') return {ie:g.ie_a, alt:g.alt_a};
  return {ie:g.ie, alt:g.alt};
}
function categoriaNivel(g, acum, A, z1){
  if(acum <= g.ie*A + 0.5 && z1 <= g.alt + 1e-6) return 'base';
  if(acum <= g.ie_a*A + 0.5 && z1 <= g.alt_a + 1e-6) return 'ampliado';
  return 'maximo';
}
// op: {paths, zonaG, esc, hPiso=3, huellaPct=1}
function volumetria(op){
  const g=POT[op.zonaG], h=op.hPiso||3, pct=op.huellaPct==null?0.9:op.huellaPct; // Huella del edificio: 90% por defecto (el sótano siempre usa la huella máxima)
  const A=areaAbs(op.paths), lim=limitesEscenario(op.zonaG, op.esc||'base');
  // Huella del bloque inferior: la forma del predio menos el área permeable (convención: retiro uniforme)
  let inf = g.perm>0 ? insetHastaArea(op.paths, A*(1-g.perm)).paths : op.paths;
  if(pct<1) inf = insetHastaArea(inf, areaAbs(inf)*pct).paths;
  // Huella del bloque superior: retirada sepBS de TODOS los linderos (incluida la calle) y dentro de la inferior
  const sup = interseccion(insetPaths(op.paths, g.sepBS), inf);
  const aInf=areaAbs(inf), aSup=areaAbs(sup), m2Lim=lim.ie*A;
  const niveles=[]; let acum=0, motivo=null, i=0;
  while(i<200){
    i++; const z0=(i-1)*h, z1=i*h;
    if(z1 > lim.alt + 1e-6){ motivo='altura'; break; }
    const bloque = z1 <= g.bs + 1e-6 ? 'inferior' : 'superior';
    let area = bloque==='inferior' ? aInf : aSup;
    if(area < 1){ motivo='retiro'; break; }
    const resta = m2Lim - acum;
    if(resta <= 1){ motivo='indice'; break; }
    // Convención: un último nivel menor a 1/4 de planta no se construye (queda como remanente del índice)
    if(area > resta && resta < area*0.25){ motivo='indice'; break; }
    let parcial=false; if(area > resta){ area=resta; parcial=true; }
    acum += area;
    niveles.push({n:i, z0, z1, bloque, area, acum, parcial, pisosNorma: h>4?Math.ceil(h/4):1, cat:categoriaNivel(g, acum, A, z1)});
    if(parcial){ motivo='indice'; break; }
  }
  const alt = niveles.length ? niveles[niveles.length-1].z1 : 0;
  return {A, lim, aInf, aSup, inf, sup, niveles, m2:acum, alt, pctIE: acum/(g.ie*A), motivo,
          m2Base:g.ie*A, m2Amp:g.ie_a*A, m2Max:g.ie_max?g.ie_max*A:null};
}

// Programa, parqueos, sótanos y valor sobre una volumetría (mismo motor que la calculadora)
const DEV_ESTANDAR = {com:4, imp:5, finTasa:9, finMeses:24, finPct:70, iva:'si'};
function evaluarVolumetria(v, op){
  const au=op.au||80, g=POT[op.zonaG], pv=op.pv||null, m2Plaza=op.m2Plaza||30;
  const nu=Math.floor(v.m2/1.2/au), m2R=nu*au;
  const est=estacionamientos({zonaG:op.zonaG, nu, m2R, am:0, plazasU:op.plazasU||1, visitas:null});
  const sot=calcSotanoV10({area:v.A, perm:g.perm, huella:v.aInf, plazas:est.total, m2Plaza,
    ancho:0, largo:0, nivDecl:0, areaDecl:0, permiteSup: op.zonaG==='G1'||op.zonaG==='G2'||op.zonaG==='G3'});
  const ventas = pv ? m2R*pv : 0;
  const C = costosProyecto({zonaG:op.zonaG, area:v.A, m2T:v.m2, cm2:op.cm2||580, di:5.5, ad:5.5, ins:13,
    sot, cSot:op.cSot||700, esMax: op.esc==='ampliado'||op.esc==='maximo', dev:op.dev||DEV_ESTANDAR, ventas}); // caución 5% sobre lo obtenido por incentivos (COM-48-2024)
  const valor = pv ? valorResidual(ventas, C.total, op.margen||25) : null;
  // Procedimiento según el nivel más exigente alcanzado
  const proc = v.niveles.some(n=>n.cat!=='base') ? 'DCT con incentivos (o Junta + vecinos)' : 'DCT, vía directa';
  return {nu, m2R, est, sot, ventas, C, valor, proc};
}

const API={POT, LAB1_VENTA, paramsEscenario, visitasNorma, estacionamientos, calcSotanoV10, costosProyecto,
  programaAuto, evaluarProyecto, valorResidual, areaAbs, insetPaths, interseccion, insetHastaArea, lonLatAMetros,
  limitesEscenario, volumetria, evaluarVolumetria};
if(typeof module!=='undefined' && module.exports) module.exports=API; else root.POTMotor=API;
})(typeof window!=='undefined'?window:globalThis);
</script>

function zpNorm(v){ if(!v) return null; v=String(v); return v.startsWith('z') ? v : 'z'+String(parseInt(v,10)).padStart(2,'0'); }

async function cargarPredio(){

function minRect(ring){
  let best = [Infinity, Infinity, Infinity];

// Figuras a escala: gris claro, solo fuera de los predios
function crearAmbiente(){
  const grp = new THREE.Group(), polys = [S.paths[0]].concat(S.vecinos.map(v => v.r));
  const dentro = (x,y,rg) => { let c=false; for(let i=0,j=rg.length-1;i<rg.length;j=i++){ const [xi,yi]=rg[i],[xj,yj]=rg[j]; if(((yi>y)!=(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c; } return c; };
  const dSeg = (px,py,[ax,ay],[bx,by]) => { const dx=bx-ax, dy=by-ay, t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy||1))); return [Math.hypot(px-ax-t*dx, py-ay-t*dy), Math.atan2(dy,dx)]; };
  const libre = [];
  for(let x=-95;x<=95;x+=2.5) for(let y=-95;y<=95;y+=2.5){
    if(polys.some(rg => dentro(x,y,rg))) continue;
    let dm=1e9, ang=0; polys.forEach(rg => { for(let i=0;i<rg.length;i++){ const [d,a]=dSeg(x,y,rg[i],rg[(i+1)%rg.length]); if(d<dm){dm=d;ang=a;} } });
    if(dm<25) libre.push({x,y,d:dm,ang});
  }
  let seed=7; const rnd = () => (seed=(seed*16807)%2147483647)/2147483647;
  const lejos = (p,arr,m) => arr.every(q => Math.hypot(p.x-q.x,p.y-q.y) > m);
  const mat = c => new THREE.MeshLambertMaterial({color:c});
  const autos=[]; libre.filter(p=>p.d>=3&&p.d<=6).sort(()=>rnd()-.5).forEach(p=>{ if(autos.length<9 && lejos(p,autos,11)) autos.push(p); });
  autos.forEach((p,i) => { const bus=i===0, L=bus?11:4.4, A=bus?2.5:1.8, H=bus?3:1, g=new THREE.Group();
    const b=new THREE.Mesh(new THREE.BoxGeometry(L,H,A), mat(0xd2d2cd)); b.position.y=H/2+.3; g.add(b);
    if(!bus){ const c=new THREE.Mesh(new THREE.BoxGeometry(L*.5,.6,A*.92), mat(0xbdbdb8)); c.position.set(-.2,H+.6,0); g.add(c); }
    g.position.set(p.x,0,-p.y); g.rotation.y=p.ang; grp.add(g); });
  const arb=[]; libre.filter(p=>p.d>=.8&&p.d<=2.2).sort(()=>rnd()-.5).forEach(p=>{ if(arb.length<34 && lejos(p,arb,9) && lejos(p,autos,4)) arb.push(p); });
  arb.forEach(p => { const h=5+rnd()*2.5, rc=1.8+rnd();
    const t=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,h*.55,6), mat(0xbdbdb8)); t.position.set(p.x,h*.275,-p.y); grp.add(t);
    const c=new THREE.Mesh(new THREE.SphereGeometry(rc,12,8), mat(0xcfd6cb)); c.position.set(p.x,h*.55+rc*.8,-p.y); c.scale.y=1.1; grp.add(c); });
  const gente=[]; libre.filter(p=>p.d>=.6&&p.d<=2.5&&Math.hypot(p.x,p.y)<60).sort(()=>rnd()-.5).forEach(p=>{ if(gente.length<16 && lejos(p,gente,3) && lejos(p,arb,1.5)) gente.push(p); });
  gente.forEach(p => { const h=1.6+rnd()*.2;
    const b=new THREE.Mesh(new THREE.CylinderGeometry(.2,.24,h*.8,8), mat(0xa9a9a4)); b.position.set(p.x,h*.4,-p.y); grp.add(b);
    const c=new THREE.Mesh(new THREE.SphereGeometry(.14,8,6), mat(0xa9a9a4)); c.position.set(p.x,h*.8+.12,-p.y); grp.add(c); });
  return grp;
}

let az = 0.68, el = 0.62, zoom = 1, fr = 60;
function ajustarCamara(){
  const w = vista.clientWidth, h = vista.clientHeight; if(!w || !h || !S.paths) return;
  r.setSize(w, h, false); res.set(w, h); lineMats.forEach(m => m.resolution.set(w, h));
  const bb = new THREE.Box3(); S.paths[0].forEach(([x,y]) => bb.expandByPoint(new THREE.Vector3(x,0,-y)));
  const lado = Math.max(bb.max.x-bb.min.x, bb.max.z-bb.min.z);
  fr = Math.max(lado*0.95, 45, (S.lim ? S.lim.alt : 30)*0.75);
  const asp = w/h; cam.left=-fr*asp; cam.right=fr*asp; cam.top=fr; cam.bottom=-fr; cam.zoom=zoom; cam.updateProjectionMatrix();
  posCam();
}
function posCam(){
  const d = 500, y0 = Math.min(S.alt || 10, 40)*0.35;
  cam.position.set(Math.sin(az)*Math.cos(el)*d, Math.sin(el)*d + y0, Math.cos(az)*Math.cos(el)*d);
  cam.lookAt(0, y0, 0); cam.zoom = zoom; cam.updateProjectionMatrix(); pedirRender();
}
function ponerVista(v){

// Mouse, dedo y pellizco
const pts = new Map(); let pinch0 = 0, zoom0 = 1;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); zoom0=zoom; } });
cv.addEventListener('pointermove', e => { if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ az -= (e.clientX-p.x)*.006; el = Math.min(1.55, Math.max(.03, el+(e.clientY-p.y)*.004)); posCam(); }
  else if(pts.size===2 && pinch0){ const [a,b]=[...pts.values()]; zoom = Math.min(6, Math.max(.4, zoom0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0)); posCam(); } });
const fin = e => { pts.delete(e.pointerId); if(pts.size<2) pinch0=0; };
cv.addEventListener('pointerup', fin); cv.addEventListener('pointercancel', fin);
cv.addEventListener('wheel', e => { e.preventDefault(); zoom = Math.min(6, Math.max(.4, zoom*(1-e.deltaY*.0012))); posCam(); }, {passive:false});

function bbox(ring){ const xs=ring.map(p=>p[0]), ys=ring.map(p=>p[1]); return {x0:Math.min(...xs), x1:Math.max(...xs), z0:-Math.max(...ys), z1:-Math.min(...ys)}; }

let tUmbral = null;

function unaVez(k, txt, acc){ if(S.visto[k]) return false; S.visto[k] = true; decir(txt, acc); return true; }
function umbrales(antesN){

  if(ult.cat==='ampliado') return unaVez('inc', simple ? 'Este piso solo es posible con incentivos: el proyecto debe cumplir obligaciones y contratar un seguro.' : `Escenario ampliado: IE hasta ${g.ie_a}, altura hasta ${g.alt_a} m. Seguro de caución del 5% sobre lo obtenido por incentivos (COM-48-2024).`, true);
  if(ult.bloque==='superior') return unaVez('sup', simple ? `Desde aquí, el edificio debe separarse ${g.sepBS} m de los vecinos y de la calle. Por eso los pisos de arriba son más chicos.` : `Bloque superior desde ${g.bs} m: separación de ${g.sepBS} m a todos los linderos, incluido el espacio vial (arts. 43-47). Una separación menor requiere Junta Directiva con consulta a vecinos.`);
  if(S.m2 >= base - 1) return unaVez('base', simple ? `Aquí se acaba lo que se puede construir sin trámites especiales: ${fmt(base)} m².` : `Índice base agotado (${g.ie} × ${fmt(S.A)} m²). Lo que sigue requiere incentivos o resolución de Junta.`);
  if(S.n===1) return unaVez('primer', simple ? `Cada nivel suma ${fmt(ult.area)} m². Llevás ${Math.round(S.m2/base*100)}% de lo que permite la norma.` : `Nivel 1: ${fmt(ult.area)} m². Índice usado: ${(S.m2/S.A).toFixed(2)} de ${g.ie} (base).`);
}

  if(g==='G1') partes.push(simple ? 'Esta zona protege las laderas: permite construir poco y exige dejar la mayor parte del terreno natural.' : 'G1: IE 1.2, 70% permeable, bloque inferior hasta 8 m (art. 43).');
  if(g==='G2') partes.push(simple ? 'En esta zona el edificio debe separarse de los vecinos desde el tercer piso.' : 'G2: bloque inferior hasta 8 m; bloque superior a 3 m de todos los linderos (art. 44).');
  if(S.ancho && S.ancho < 15) partes.push(simple ? 'Este terreno es angosto: las rampas del sótano ocupan mucho espacio y cada nivel rinde pocos parqueos.' : `Ancho de ${Math.round(S.ancho)} m: rampa y doble crujía de estacionamiento difíciles. Verificar con diseño.`);
  if(S.fuente && !S.fuente.startsWith('Forma real')) partes.unshift(S.fuente);
  if(partes.length) aviso(partes.join(' '));
}
function aviso(t){ const a = $('#aviso'); a.textContent = t; a.style.display = 'block'; setTimeout(() => { a.style.display = 'none'; }, 12000); }

// ─── Actualizar todo ───
function actualizar(antesN){
  calcular(); construirEscena(); panel();
  const dijo = antesN !== undefined ? umbrales(antesN) : false;
  avisoSotano(dijo);
  if(S.n && S.pv && S.ev && S.ev.valor === 0) unaVez('nocierra', S.modo==='simple' ? 'Con los precios de venta de esta zona, un edificio de apartamentos no alcanza a pagar sus costos. Aquí conviene pensar en otro tipo de proyecto.' : 'Valor residual del terreno en cero con los supuestos actuales. Revisá precio de venta, parqueos o acabados.');
  posCam();
}

// ─── Controles ───
$('#mas').onclick = () => { if(S.n >= S.vol.niveles.length) return avisoBloqueo(); const a=S.n; S.n++; actualizar(a); if(S.n >= S.vol.niveles.length) setTimeout(avisoBloqueo, 2500); };
$('#menos').onclick = () => { S.n = Math.max(0, S.n-1); actualizar(); };
$('#llenar').onclick = () => { const a=S.n; S.n = 999; actualizar(a); setTimeout(avisoBloqueo, 2500); };
$$('[data-esc]').forEach(b => b.onclick = () => { S.esc = b.dataset.esc; actualizar(); ajustarCamara(); });
$$('[data-pu]').forEach(b => b.onclick = () => {
  const antes = S.ev && S.ev.valor; S.pu = +b.dataset.pu; actualizar();
  if(S.n && S.pv && antes != null) decir(S.modo==='simple' ? `Con ${S.pu} parqueo${S.pu>1?'s':''} por apartamento, el valor del terreno pasa de ${(antes/1e6).toFixed(1)} a ${(S.ev.valor/1e6).toFixed(1)} millones de dólares.` : `Plazas: ${S.ev.est.total} (mínimo municipal: ${S.ev.est.norma}). Sótanos: ${S.ev.sot.niveles}.`);
});
$$('[data-modo]').forEach(b => b.onclick = () => { S.modo = b.dataset.modo; actualizar(); });
$$('[data-show]').forEach(b => b.onclick = () => { const k=b.dataset.show; S.show[k] = !S.show[k]; b.classList.toggle('on', S.show[k]); b.setAttribute('aria-pressed', S.show[k]); construirEscena(); });
$$('[data-vista]').forEach(b => b.onclick = () => ponerVista(b.dataset.vista));
$('#h-piso').onchange = e => { S.hPiso = Math.min(6, Math.max(2.6, parseFloat(e.target.value)||3)); e.target.value = S.hPiso; actualizar(); ajustarCamara();
  if(S.hPiso > 4) decir('Con más de 4 m entre pisos, cada nivel cuenta como dos pisos para la norma (art. 39).'); };
$('#huella').onchange = e => { S.huella = Math.min(100, Math.max(30, parseFloat(e.target.value)||90))/100; e.target.value = Math.round(S.huella*100); actualizar(); };

$('#btn-mostrar').onclick = () => { const m = $('#mostrar'); m.classList.toggle('abierto'); $('#btn-mostrar').setAttribute('aria-expanded', m.classList.contains('abierto')); };
if(window.matchMedia('(max-width:768px)').matches) $('#llenar').textContent = 'Llenar';

// ─── Glosario ───
const pop = $('#pop');
document.addEventListener('click', e => {
  const t = e.target.closest('[data-g]');
  if(!t){ if(!e.target.closest('#pop')) pop.style.display='none'; return; }
  const d = GLOS[t.dataset.g]; if(!d) return;
  pop.innerHTML = `<b>${d[0]}</b>${d[1]}` + (S.modo==='tecnico' ? `<small>${d[2]}</small>` : '');
  const rc = t.getBoundingClientRect(); pop.style.display='block';
  pop.style.left = Math.max(8, Math.min(window.innerWidth-296, rc.left)) + 'px';
  pop.style.top = (rc.bottom + 6 + pop.offsetHeight > window.innerHeight ? rc.top - pop.offsetHeight - 6 : rc.bottom + 6) + 'px';
});

// ─── Modales: cierre y supuestos ───
function modal(html){ $('#modal-c').innerHTML = html; $('#modal').style.display = 'flex'; }
$('#modal .cerrar').onclick = () => { $('#modal').style.display = 'none'; };
$('#modal').onclick = e => { if(e.target.id==='modal') $('#modal').style.display = 'none'; };
$('#btn-cierre').onclick = () => modal(`<h2>Lo que este modelo no decide</h2>
<p>Hasta aquí viste lo máximo que la norma permite. Pero dos edificios con los mismos metros pueden valer muy distinto. La diferencia la hacen decisiones que ningún cálculo automático toma:</p>
<ul><li><b>Cuánto se vende de lo que se construye.</b> Una planta bien resuelta vende más metros y desperdicia menos en pasillos.</li>
<li><b>Luz y ventilación.</b> Cada apartamento necesita ventanas, y la norma exige patios de cierto tamaño si dan hacia ellos.</li>
<li><b>El sótano.</b> Rampas, maniobras y columnas deciden cuántos parqueos caben de verdad.</li>
<li><b>Vistas y vecinos.</b> Cómo se ubica el edificio define qué ve cada apartamento y a quién le quita el sol.</li>
<li><b>Todo lo que este modelo no revisa.</b> Distancias del Código Civil, altura aeronáutica, conjuntos históricos y el trámite ante la Municipalidad.</li></ul>
<p><b>Mismos metros, tres edificios:</b></p>
<table><thead><tr><th>Forma</th><th>A favor</th><th>En contra</th></tr></thead><tbody>
<tr><td>Bloque compacto</td><td>Construcción sencilla y económica</td><td>Apartamentos del centro con poca luz; casi sin área libre</td></tr>
<tr><td>Con patio central</td><td>Luz y ventilación para todos; un jardín común</td><td>Necesita más pisos para los mismos metros</td></tr>
<tr><td>Torre sobre basamento</td><td>Vistas, más terreno libre, menos impacto en los vecinos</td><td>Estructura y elevadores más caros</td></tr></tbody></table>
<p><b>Convertir esta caja en un buen proyecto es el trabajo de un arquitecto.</b> Antes de comprar, vender o diseñar, consultá con un profesional colegiado: puede ser la diferencia entre un terreno que vale lo mínimo y uno que vale lo que realmente puede dar.</p>`);
$('#btn-supuestos').onclick = () => modal(`<h2>Supuestos</h2>
<p>Orientación, no un proyecto ni un avalúo. Reglas del POT (COM-030-08 y reformas). Verificá tu caso con la Dirección de Control Territorial.</p>
<ul><li>Pisos de ${S.hPiso} m. El edificio ocupa el ${Math.round(S.huella*100)}% de lo construible y el sótano todo lo permitido.</li>
<li>El área permeable se dibuja como una franja alrededor del predio. El terreno se dibuja plano.</li>
<li>Apartamentos de 80 m² con 20% de circulación; parqueos de 30 m² incluyendo rampas; sótano a US$700/m².</li>
<li>Precios de venta y costos: los de la Calculadora POT (Lab 1 UMBRAL 2025).</li>
<li><b>Escenario máximo:</b> valores del reglamento de incentivos de 2024 pendientes de confirmar con el texto oficial.</li>
<li><b>No incluido:</b> altura aeronáutica, conjuntos históricos, planes locales y distancias del Código Civil. Pueden ser más estrictos que la zona G.</li></ul>
<p>${S.fuente}</p>`);

// ─── Recorrido guiado (6 pasos) ───
const PASOS = [
  {t:'Este es tu terreno', p:() => `${fmt(S.A)} m² en zona ${S.zonaG}. El color indica qué tan denso puede ser lo que se construya aquí.`, a:() => { S.n=0; S.show.fant=false; }, f:null},
  {t:'Esto es lo máximo que permite la norma', p:() => { const g=M.POT[S.zonaG]; return `La caja punteada es el volumen más grande que la Municipalidad permite aquí sin trámites especiales: ${fmt(g.ie*S.A)} m² y hasta ${g.alt} m de altura.`; }, a:() => { S.esc='base'; S.n=0; S.show.fant=true; }, f:null},
  {t:'Construí piso por piso', p:() => 'Tocá + para agregar niveles. Mirá cómo se van usando los metros permitidos.', a:() => { S.n=1; }, f:'#stepper'},
  {t:'Los parqueos van abajo', p:() => 'Cada apartamento necesita parqueos, y en esta zona van en sótanos. Son el costo que más pesa en el proyecto.', a:() => { S.n=999; S.show.sot=true; }, f:'#b-parq'},
  {t:'Con incentivos se puede más', p:() => 'La Municipalidad permite construir más si el proyecto cumple ciertas obligaciones. Cambiá de escenario para verlo.', a:() => { S.esc='ampliado'; S.n=999; }, f:'#b-esc'},
  {t:'La caja no es el edificio', p:() => 'Este modelo muestra lo que la norma permite, no el mejor proyecto. Cómo convertir esta caja en un buen edificio es trabajo de un arquitecto.', a:() => { S.esc='base'; S.n=999; }, f:'#btn-cierre'}
];
let paso = -1;
function irPaso(i){
  $$('.foco').forEach(e => e.classList.remove('foco'));
  if(i < 0 || i >= PASOS.length){ paso=-1; $('#tour').style.display='none'; $('#velo').style.display='none'; S.show.fant=true; S.show.sot=true; S.esc='base'; S.n=999; S.visto={};
    $$('[data-show]').forEach(b => { b.classList.toggle('on', S.show[b.dataset.show]); });
    try{ localStorage.setItem('umbral3d_tour','1'); }catch(e){}
    S.silencio = true; actualizar(); S.silencio = false; return; }
  paso = i; const P = PASOS[i]; P.a(); S.visto = {primer:true, base:true, sup:true, inc:true, max:true, nocierra:true}; S.silencio = true;
  $$('[data-show]').forEach(b => { b.classList.toggle('on', S.show[b.dataset.show]); });
  actualizar(); S.visto = {}; S.silencio = false;
  $('#tour-n').textContent = 'Paso ' + (i+1) + ' de ' + PASOS.length;
  $('#tour-pasos').innerHTML = PASOS.map((_,k) => `<i class="${k<=i?'on':''}"></i>`).join('');
  $('#tour-t').textContent = P.t; $('#tour-p').textContent = P.p();
  $('#tour-atras').disabled = i===0; $('#tour-sig').textContent = i===PASOS.length-1 ? 'Terminar' : 'Siguiente';
  $('#tour').style.display='flex'; $('#velo').style.display='block';
  if(P.f) $(P.f).classList.add('foco');
}
$('#tour-sig').onclick = () => irPaso(paso+1);
$('#tour-atras').onclick = () => irPaso(paso-1);
$('#tour-saltar').onclick = () => irPaso(-1);
$('#btn-tour').onclick = () => irPaso(0);

// ─── Inicio ───
(async function(){
  await cargarPredio();
  if(!M.POT[S.zonaG]){ S.vol={niveles:[],inf:S.paths,sup:[],aInf:0}; S.lim={ie:0,alt:0}; construirEscena(); panel(); ajustarCamara(); avisosIniciales(); return; }
  S.n = 999; calcular(); S.prevSot = S.ev ? S.ev.sot.niveles : 0;
  actualizar(); ajustarCamara(); ponerVista('axo'); avisosIniciales();
  let visto = false; try{ visto = !!localStorage.getItem('umbral3d_tour'); }catch(e){}
  if(!visto) setTimeout(() => irPaso(0), 600);
})();
})();
</script>
